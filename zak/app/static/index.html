<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header class="top hidden" id="top">
  <div class="search-wrap">
    <input id="q" type="search" data-lang="ar" dir="auto" placeholder="Search patient — name or phone  (F2)" autocomplete="off">
    <div id="qres" class="dropdown hidden"></div>
  </div>
  <nav id="nav">
    <button data-go="#/today">Today</button>
    <button data-go="#/new" class="primary">+ New patient</button>
    <button data-go="#/log" class="dr">Visits log</button>
    <button data-go="#/calc" class="dr">Calculators</button>
    <button data-go="#/reg" class="dr">Registries</button>
    <button data-go="#/stats" class="dr">Statistics</button>
    <button data-go="#/money" class="dr">Accounts</button>
    <button data-go="#/settings">Settings</button>
  </nav>
  <div id="cloud" class="net hidden" style="margin-left:auto"></div>
  <div id="net" class="net ok" title="Save status" style="margin-left:0">● Saved</div>
  <button id="who" class="who" title="Sign out"></button>
</header>
<main id="view"></main>
<div id="toast" class="toast hidden"></div>
<div id="combo" class="dropdown combo hidden"></div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<script src="app.js"></script>
<script src="extra.js"></script>
<script src="more.js"></script>
<script src="ar.js"></script>
<script src="phone.js"></script>
<script>
/* program version + date at the top of the screen (all clinics) */
(function () {
  fetch('/api/version').then(r => r.json()).then(v => {
    if (!v || !v.version) return;
    const d = v.date ? v.date.slice(8, 10) + '/' + v.date.slice(5, 7) + '/' + v.date.slice(0, 4) : '';
    const el = document.createElement('div'); el.id = 'verTag';
    el.textContent = 'v ' + v.version + (d ? ' · ' + d : ''); el.title = 'Program version (updates automatically)';
    el.style.cssText = 'position:fixed;top:0;left:0;z-index:9999;font:10px/1.35 Tahoma,Arial,sans-serif;direction:ltr;' +
      'background:rgba(0,0,0,.55);color:#fff;padding:0 8px;border-radius:0 0 6px 0;pointer-events:none;opacity:.8';
    document.body.appendChild(el);
  }).catch(() => { });
})();
</script>
</body>
</html>
