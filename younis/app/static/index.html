<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيادة د. مهند يونس</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="search-wrap">
    <input id="q" type="search" data-lang="ar" dir="auto" placeholder="ابحث هنا عن اسم او رقم هاتف  (F2)" autocomplete="off">
    <div id="qres" class="dropdown hidden"></div>
  </div>
  <nav>
    <button data-go="#/today">مواعيد اليوم</button>
    <button data-go="#/new" class="primary" dir="rtl">+ اضافة مريض</button>
    <button data-go="#/expenses">المصاريف</button>
    <button data-go="#/labs">المختبرات</button>
    <button data-go="#/debts">الديون</button>
    <button data-go="#/report">التقرير</button>
    <button data-go="#/review">التكرار <span id="dupBadge" class="badge hidden"></span></button>
    <button data-go="#/settings">الإعدادات</button>
    <button id="helpBtn" class="help" title="مساعدة — شرح أجزاء الصفحة">?</button>
  </nav>
  <div id="pcBadge" class="pcb hidden" title="الجهاز الذي يعمل عليه البرنامج الآن"></div>
  <div id="cloud" class="cloud off" title="المزامنة السحابية">☁</div>
  <div id="net" class="net ok" title="حالة الحفظ">● محفوظ</div>
  <button id="closeBtn" class="closeb hidden" title="رفع آخر البيانات إلى Google Drive ثم إغلاق البرنامج — ليفتح على الجهاز الآخر">⏻ إغلاق</button>
</header>
<div id="roBar" class="robar hidden"></div>
<main id="view"></main>
<div id="toast" class="toast hidden"></div>
<div id="combo" class="dropdown combo hidden"></div>
<script src="app.js"></script>
<script>
/* program version + date at the top of the screen (all clinics) */
(function () {
  fetch('/api/version').then(r => r.json()).then(v => {
    if (!v || !v.version) return;
    const d = v.date ? v.date.slice(8, 10) + '/' + v.date.slice(5, 7) + '/' + v.date.slice(0, 4) : '';
    const el = document.createElement('div'); el.id = 'verTag';
    el.textContent = 'v ' + v.version + (d ? ' · ' + d : ''); el.title = 'Program version (updates automatically)';
    el.style.cssText = 'position:fixed;top:0;left:0;z-index:9999;font:10px/1.35 Tahoma,Arial,sans-serif;direction:ltr;' +
      'background:rgba(0,0,0,.55);color:#fff;padding:0 8px;border-radius:0 0 6px 0;pointer-events:none;opacity:.8';
    document.body.appendChild(el);
  }).catch(() => { });
})();
</script>
</body>
</html>
